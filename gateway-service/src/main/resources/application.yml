server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      password: ${REDIS_PASSWORD:}
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:localhost:6379,localhost:6380,localhost:6381,localhost:6382,localhost:6383,localhost:6384}
        max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                  - ${FRONTEND_ORIGIN_ALT:http://127.0.0.1:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          discovery:
            locator:
              enabled: true
          routes:
            - id: auth-public
              uri: lb://auth-service
              predicates:
                - Path=/auth/login,/auth/register
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@rateLimitKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH_RATE:1}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST_CAPACITY:3}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_AUTH_REQUESTED_TOKENS:1}
            - id: business-sensitive
              uri: lb://auth-service
              predicates:
                - Path=/api/purchase-orders/{orderId}/panic-buy,/api/transport-orders/{orderId}/claim
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@rateLimitKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_SENSITIVE_REPLENISH_RATE:1}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_SENSITIVE_BURST_CAPACITY:2}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_SENSITIVE_REQUESTED_TOKENS:1}
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@rateLimitKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_API_REPLENISH_RATE:20}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_API_BURST_CAPACITY:40}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_API_REQUESTED_TOKENS:1}
            - id: business-demo-service
              uri: lb://auth-service
              predicates:
                - Path=/api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@rateLimitKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_API_REPLENISH_RATE:20}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_API_BURST_CAPACITY:40}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_API_REQUESTED_TOKENS:1}
